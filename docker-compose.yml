x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: kgpa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kgpa_jam
    volumes:
      - ${PGDATA_DIR:-./data/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgpa -d kgpa_jam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    build: ./backup
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: kgpa
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: kgpa_jam
      MAX_BACKUPS: "10"
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kgpa:${DB_PASSWORD}@db:5432/kgpa_jam?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ${UPLOADS_DIR:-./data/uploads}:/app/uploads
    ports:
      - "3000:3000"
